name: mindls

# Mind 8 for Linux は x86 32bit バイナリのため platform は linux/386 固定。
# Apple Silicon では非ネイティブアーキテクチャのエミュレーションで動作する
# （Rosetta は x86_64 向けで 32bit x86 は対象外）。

x-mind-common: &mind-common
  platform: linux/386
  working_dir: /work
  volumes:
    # リポジトリ全体をマウントする（fixtures/ や tools/ からそのまま使えるように）
    - .:/work
  environment:
    LANG: ja_JP.eucJP
    JLESSCHARSET: japanese
  tty: true
  stdin_open: true

x-mind-build: &mind-build
  context: .
  dockerfile: Dockerfile
  platforms:
    - linux/386
  args:
    MIND_TARBALL: vendor/mind-for-linux-8.0.08.tgz

services:
  # Mind コンパイラ／ランタイムだけの最小イメージ。
  # Language Server からコンパイラを叩くバックエンドとして使う想定。
  mind:
    <<: *mind-common
    image: mindls/mind:8.0.08
    build:
      <<: *mind-build
      target: runtime
    command: ["bash"]

  # コンテナの中で開発もしたい場合（build-essential / git / python3 入り）
  dev:
    <<: *mind-common
    image: mindls/mind-dev:8.0.08
    build:
      <<: *mind-build
      target: dev
    command: ["bash"]
